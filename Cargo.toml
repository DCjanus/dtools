[package]
name = "dcx"
version = "0.1.0"
authors = ["DCjanus <DCjanus@dcjanus.com>"]
edition = "2024"
default-run = "dcx"
description = "用于处理文本、维护 Git 仓库和辅助 Coding Agent 的小型命令行工具集"
repository = "https://github.com/DCjanus/dcx"
license = "MIT"
readme = "README.md"
keywords = ["cli", "git", "sort", "text", "uniq"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/latest/dcx-{ target }{ archive-suffix }"
bin-dir = "dcx-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[package.metadata.binstall.overrides.'cfg(not(target_os = "windows"))']
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.103"
base64 = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.6.7", features = ["unstable-dynamic"] }
comfy-table = "8.0.0"
crossterm = "0.29.0"
fs2 = "0.4.3"
gix = { version = "0.87.1", default-features = false, features = ["basic", "sha1", "pack-cache-lru-dynamic", "comfort"] }
globset = "0.4.19"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
ratatui = "0.30.2"
rustc-stable-hash = "0.1.2"
serde_json = "1.0.151"
size = "0.5.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
